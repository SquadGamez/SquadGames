<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Details - Squad Games Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .details-container {
            max-width: 800px;
            margin: 0 auto;
            background: #1c1c1e;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #2c2c2e;
        }
        .back-link {
            color: #007aff;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .game-header-flex {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .game-header-flex img {
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
            object-fit: cover;
        }
        .game-info {
            flex: 1;
            min-width: 250px;
        }
        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            color: #ffffff;
        }
        .category-tag {
            background: #2c2c2e;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #007aff;
            display: inline-block;
            margin-bottom: 10px;
        }
        .price {
            font-size: 1.4rem;
            font-weight: bold;
            color: #25d366;
            margin: 15px 0;
        }
        .section-box {
            background: #121212;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #2c2c2e;
        }
        .section-box h3 {
            margin-top: 0;
            color: #f1c40f;
            font-size: 1rem;
        }
        .install-guide-content {
            color: #ccc;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .btn-action {
            display: inline-block;
            background: #25d366;
            color: #fff;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
        }
        .btn-action:hover {
            background: #1da851;
        }
    </style>
</head>
<body>

    <div class="details-container">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Store</a>
        
        <div class="game-header-flex">
            <img id="detailGameImage" src="" alt="Game Cover">
            <div class="game-info">
                <span id="detailGameCategory" class="category-tag">Category</span>
                <h1 id="detailGameTitle">Loading Game...</h1>
                <div id="detailGamePrice" class="price">FREE</div>
                <p id="detailGameDescription"></p>
            </div>
        </div>

        <div class="section-box">
            <h3><i class="fa-solid fa-microchip"></i> System Requirements</h3>
            <p id="detailGameRequirements" style="color: #aaa; margin-bottom: 0;">Loading requirements...</p>
        </div>

        <!-- HOW TO INSTALL SECTION -->
        <div class="section-box" style="border-left: 4px solid #f1c40f;">
            <h3><i class="fa-solid fa-book-open"></i> How to Install</h3>
            <div id="gameInstallGuide" class="install-guide-content">
                Loading installation steps...
            </div>
        </div>

        <a id="detailDownloadBtn" href="#" target="_blank" class="btn-action"><i class="fa-solid fa-download"></i> Download / Get Game</a>
    </div>

    <!-- Include your script file -->
    <script src="script.js"></script>
</body>
</html>
