<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Games Store TZ</title>
    <!-- FontAwesome Icons for buttons & spinners -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Container -->
    <div class="container">

        <!-- Permanent Portal Header & Styled Navigation Box -->
        <div class="portal-header-wrapper">
            <div class="portal-logo-area">
                <h1 class="portal-logo">Squad Games Store TZ</h1>
                
                <!-- Sleek Modern Search Box Styling -->
                <div class="portal-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="gameSearchInput" placeholder="Search games, mods, simulator...">
                </div>
            </div>

            <!-- Portal Navigation Tabs (Categories) -->
            <nav class="portal-navbar">
                <button class="nav-tab active" data-category="all">All Games</button>
                <button class="nav-tab" data-category="pc">PC Games</button>
                <button class="nav-tab" data-category="simulation">Simulation</button>
                <button class="nav-tab" data-category="action">Action</button>
                <button class="nav-tab" data-category="android">Mobile / Android</button>
            </nav>
        </div>

        <!-- Intro Banner -->
        <div class="intro-banner">
            <h2>Welcome to Squad Games Store TZ</h2>
            <p>Get your favorite PC and Mobile games & mods in Tanzania</p>
        </div>

        <!-- Top Split Section Layout (Featured Marquee & Most Popular) -->
        <div class="top-split-container">
            <!-- Featured Marquee Section -->
            <div class="featured-epic-wrapper">
                <h3 class="section-title">🔥 Featured</h3>
                <div class="featured-marquee-container">
                    <div id="featuredTrack" class="featured-marquee-track">
                        <!-- Featured items load here via JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Most Popular Games Section -->
            <div class="most-popular-wrapper">
                <h3 class="section-title">⭐ Popular</h3>
                <div id="popularList" class="popular-list">
                    <!-- Popular items load here via JavaScript -->
                </div>
            </div>
        </div>

        <!-- Trust Bar -->
        <div class="trust-bar">
            <div class="trust-item"><span class="trust-icon">⚡</span> Fast Downloads</div>
            <div class="trust-item"><span class="trust-icon">🛡️</span> Verified Safe Files</div>
            <div class="trust-item"><span class="trust-icon">🇹🇿</span> Local TZ Support</div>
        </div>

        <!-- Main Game Catalog Grid Section -->
        <section>
            <div id="games-grid" class="game-grid">
                <!-- Dynamic game cards load here via JavaScript -->
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading games catalog...</p>
                </div>
            </div>
        </section>

    </div>

    <!-- Game Details Modal Popup -->
    <div id="details-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModalDirect()">&times;</span>
            <h2 id="modal-title" style="margin-top: 0;">Game Title</h2>
            <p id="modal-desc"></p>
            
            <div class="specs-box">
                <p style="margin: 0 0 6px 0;"><strong>Requirements:</strong> <span id="modal-req"></span></p>
                <p style="margin: 0;"><strong>Price:</strong> <span id="modal-price" style="color: var(--accent-green); font-weight: bold;"></span></p>
            </div>

            <p style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;">Screenshots</p>
            <div id="modal-gallery" class="screenshots-container">
                <!-- Screenshots load here -->
            </div>

            <div id="modal-btn-group" style="margin-top: 20px; display: flex; flex-direction: column; gap: 8px;">
                <!-- Action buttons load here -->
            </div>
        </div>
    </div>

    <!-- Fullscreen Image Modal -->
    <div id="fullscreen-modal" class="fullscreen-overlay" onclick="closeFullScreen()">
        <span class="fullscreen-close">&times;</span>
        <img id="fullscreen-img" class="fullscreen-img" src="" alt="Fullscreen View">
    </div>

    <!-- Script File -->
    <script src="script.js"></script>
</body>
</html>
