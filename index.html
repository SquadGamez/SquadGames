<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Games Store TZ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Header / Store Navigation -->
    <header>
        <h1>Squad Games Store TZ</h1>
        <p>Get your favorite PC and Mobile games & mods in Tanzania</p>
    </header>

    <!-- Games Container Grid -->
    <main>
        <div id="games-grid" class="games-grid">
            <!-- Game cards will be loaded here dynamically from your games.json -->
        </div>
    </main>

    <!-- Game Details & Download Parts Modal Popup -->
    <div id="game-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title">Game Title</h2>
            <p id="modal-description">Description goes here...</p>
            <p id="modal-requirements"><strong>Requirements:</strong> <span id="req-text"></span></p>
            
            <div id="download-section">
                <!-- Single or Multi-part download buttons will be injected here -->
            </div>
        </div>
    </div>

    <!-- Script File -->
    <script src="script.js"></script>
</body>
</html>
