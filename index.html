<!-- Script inclusion supporting games-data.js or dynamic fetch -->
    <script src="games-data.js"></script>
    <script>
        let loadedGamesData = [];
        let currentSlideIndex = 0;
        let autoSlideTimer = null;

        document.addEventListener("DOMContentLoaded", () => {
            const dataList = (typeof gamesData !== "undefined") ? gamesData : null;
            if (dataList) {
                initStore(dataList);
            } else {
                fetch("./games.json")
                    .then(response => {
                        if (!response.ok) throw new Error("Failed to load games.json");
                        return response.json();
                    })
                    .then(games => initStore(games))
                    .catch(err => {
                        console.warn("Using fallback loading:", err);
                        document.getElementById("game-grid").innerHTML = `
                            <div class="loading-state">
                                <p style="color: #ff5555;">Failed to load game catalog. Please check your connection or games-data.js file.</p>
                            </div>`;
                    });
            }
        });

        function initStore(gameList) {
            loadedGamesData = gameList;
            renderFeaturedSlider(gameList);
            renderGameGrid(gameList);
            startAutoSlide();
        }

        // --- FEATURED SLIDER LOGIC ---
        function renderFeaturedSlider(gameList) {
            const slider = document.getElementById("featured-slider");
            const dotsContainer = document.getElementById("slider-dots");
            if (!slider) return;

            const featuredIds = [1, "ets2-mobile", "5", "6", "8", 5, 6, 8];
            const featuredGames = gameList.filter(g => featuredIds.includes(g.id) || featuredIds.includes(String(g.id)));
            
            // Fallback if no matching IDs are found in custom JSON
            const activeSliderList = featuredGames.length > 0 ? featuredGames : gameList.slice(0, 4);

            slider.innerHTML = "";
            dotsContainer.innerHTML = "";

            activeSliderList.forEach((game, index) => {
                const priceText = String(game.price || "").trim().toUpperCase();
                const isFree = priceText === "FREE" || priceText === "0" || priceText.includes("FREE");
                const btnText = isFree ? "Get Game" : "Buy Now";

                const slide = document.createElement("div");
                slide.classList.add("slider-item");
                if (index === 0) slide.classList.add("active");

                slide.innerHTML = `
                    <img src="${game.image}" alt="${game.title}" onerror="this.src='images/nfsmw-shot1.png';">
                    <div class="slider-caption">
                        <span class="slider-badge">${game.platform || "PC"}</span>
                        <h3>${game.title}</h3>
                        <p>${game.description}</p>
                        <div class="slider-footer">
                            <span class="price">${game.price}</span>
                            <a href="${game.downloadUrl || 'https://wa.me/255692752060'}" target="_blank" rel="noopener" class="btn-action ${isFree ? 'btn-get' : 'btn-download'}">${btnText}</a>
                        </div>
                    </div>
                `;
                slider.appendChild(slide);

                const dot = document.createElement("span");
                dot.classList.add("slider-dot");
                if (index === 0) dot.classList.add("active");
                dot.onclick = () => currentSlide(index);
                dotsContainer.appendChild(dot);
            });
        }

        function showSlide(n) {
            const slides = document.querySelectorAll(".slider-item");
            const dots = document.querySelectorAll(".slider-dot");
            if (!slides.length) return;

            if (n >= slides.length) currentSlideIndex = 0;
            if (n < 0) currentSlideIndex = slides.length - 1;

            slides.forEach(s => s.classList.remove("active"));
            dots.forEach(d => d.classList.remove("active"));

            slides[currentSlideIndex].classList.add("active");
            dots[currentSlideIndex].classList.add("active");
        }

        function moveSlide(n) {
            clearInterval(autoSlideTimer);
            currentSlideIndex += n;
            showSlide(currentSlideIndex);
            startAutoSlide();
        }

        function currentSlide(n) {
            clearInterval(autoSlideTimer);
            currentSlideIndex = n;
            showSlide(currentSlideIndex);
            startAutoSlide();
        }

        function startAutoSlide() {
            autoSlideTimer = setInterval(() => {
                currentSlideIndex++;
                showSlide(currentSlideIndex);
            }, 5000);
        }

        // --- GRID RENDERING ---
        function renderGameGrid(gameList) {
            const container = document.getElementById("game-grid");
            if (!container) return;
            container.innerHTML = "";

            gameList.forEach((game, index) => {
                const card = document.createElement("div");
                card.classList.add("game-card");

                const priceText = String(game.price || "").trim().toUpperCase();
                const isFree = priceText === "FREE" || priceText === "0" || priceText.includes("FREE");

                const actionBtnText = isFree ? "Get Game" : "Buy Now";
                const actionBtnClass = isFree ? "btn-get" : "btn-download";
                const targetUrl = game.downloadUrl || "https://wa.me/255692752060";

                let actionButtonsHTML = `
                    <a href="${targetUrl}" target="_blank" rel="noopener" class="btn-action ${actionBtnClass}" onclick="handleDownloadClick(event, '${targetUrl}')">${actionBtnText}</a>
                `;

                if (game.altDownloadUrl) {
                    actionButtonsHTML += `
                        <a href="${game.altDownloadUrl}" target="_blank" rel="noopener" class="btn-action btn-vodacom" title="Buy via WhatsApp using Vodacom">
                            💬 Buy (Vodacom)
                        </a>
                    `;
                }

                card.innerHTML = `
                    <div class="card-badge">${game.platform || "Game"}</div>
                    <div class="game-img-wrapper">
                        <img src="${game.image}" alt="${game.title}" class="game-img" loading="lazy" onerror="this.onerror=null; this.src='images/nfsmw-shot1.png';" />
                    </div>
                    <div class="game-details">
                        <span class="category-tag">${game.category || "General"}</span>
                        <h3>${game.title}</h3>
                        <p>${game.description || ""}</p>
                        <div class="card-action">
                            <span class="price">${game.price}</span>
                            <div class="action-group">
                                <button class="btn-details" onclick="openDetails(${index})">Details</button>
                                ${actionButtonsHTML}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- DOWNLOAD LINK HANDLER ---
        function handleDownloadClick(event, url) {
            // Ensures Google Drive or direct file links open cleanly and reliably
            if (url && url.includes("drive.google.com")) {
                console.log("Redirecting to Google Drive package link:", url);
            }
        }

        // --- MODAL HANDLING ---
        function openDetails(index) {
            const game = loadedGamesData[index];
            if (!game) return;

            const priceText = String(game.price || "").trim().toUpperCase();
            const isFree = priceText === "FREE" || priceText === "0" || priceText.includes("FREE");

            const modalBtnText = isFree ? "Get Game" : "Buy Now";
            const modalBtnClass = isFree ? "btn-get" : "btn-download";
            const targetUrl = game.downloadUrl || "https://wa.me/255692752060";

            document.getElementById("modal-title").innerText = game.title;
            document.getElementById("modal-desc").innerText = game.description || "";
            document.getElementById("modal-req").innerText = game.requirements || "Standard System Requirements";
            document.getElementById("modal-price").innerText = game.price;

            const actionWrapper = document.getElementById("modal-action-wrapper");
            let modalButtonsHTML = `
                <a href="${targetUrl}" target="_blank" rel="noopener" class="btn-action ${modalBtnClass}" style="width: 100%; box-sizing: border-box; text-align: center;">${modalBtnText}</a>
            `;

            if (game.altDownloadUrl) {
                modalButtonsHTML += `
                    <a href="${game.altDownloadUrl}" target="_blank" rel="noopener" class="btn-action btn-vodacom" style="width: 100%; box-sizing: border-box; text-align: center;">
                        💬 Buy via WhatsApp (Vodacom)
                    </a>
                `;
            }
            actionWrapper.innerHTML = modalButtonsHTML;

            const gallery = document.getElementById("modal-gallery");
            gallery.innerHTML = "";

            if (game.screenshots && game.screenshots.length > 0) {
                game.screenshots.forEach((imgSrc) => {
                    const img = document.createElement("img");
                    img.src = imgSrc;
                    img.alt = "Screenshot";
                    img.loading = "lazy";
                    img.onerror = function () { this.src = "images/nfsmw-shot1.png"; };
                    img.onclick = function () { openFullScreen(imgSrc); };
                    gallery.appendChild(img);
                });
            } else {
                const img = document.createElement("img");
                img.src = game.image;
                img.alt = game.title;
                img.loading = "lazy";
                img.onclick = function () { openFullScreen(game.image); };
                gallery.appendChild(img);
            }

            document.getElementById("details-modal").classList.add("active");
        }

        function closeModal(event) {
            if (event.target.classList.contains("modal-overlay")) {
                closeModalDirect();
            }
        }

        function closeModalDirect() {
            document.getElementById("details-modal").classList.remove("active");
        }

        function openFullScreen(imgSrc) {
            const fullImg = document.getElementById("fullscreen-img");
            fullImg.src = imgSrc;
            document.getElementById("fullscreen-modal").classList.add("active"); 
        }

        function closeFullScreen() {
            document.getElementById("fullscreen-modal").classList.remove("active");
        }
    </script>
